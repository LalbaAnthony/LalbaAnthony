name: 📄 Sync README

# Primary trigger is the API call portfolio-v3 makes once a deploy is healthy
# (see update-readme in that repo's deploy.flow.yml). The weekly run is a safety
# net for a dispatch that never arrived - note GitHub disables scheduled
# workflows after 60 days without repository activity, so it is a backup, not
# something to rely on.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Every Monday at 05:00 UTC

concurrency:
  group: readme-sync
  cancel-in-progress: false

env:
  SOURCE_URL: https://anthonylalba.com/api/v1/github/profile/readme

jobs:
  sync:
    name: 📄 Sync README from portfolio data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the rendered README
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            --output README.next.md \
            "$SOURCE_URL"

      - name: Validate the payload
        run: |
          if [ ! -s README.next.md ]; then
            echo "::error::Rendered README is empty."
            exit 1
          fi

          # Built from SOURCE_URL so the marker can never drift from the URL the
          # renderer stamps into the file.
          if ! grep -qF "Generated by $SOURCE_URL" README.next.md; then
            echo "::error::Rendered README has no generation marker - refusing to overwrite."
            exit 1
          fi

          bytes=$(wc -c < README.next.md)
          if [ "$bytes" -lt 500 ]; then
            echo "::error::Rendered README is only $bytes bytes - refusing to overwrite."
            exit 1
          fi

      - name: Commit when the content changed
        run: |
          mv README.next.md README.md

          if git diff --quiet -- README.md; then
            echo "README already up to date, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): sync from portfolio data"
          git push
